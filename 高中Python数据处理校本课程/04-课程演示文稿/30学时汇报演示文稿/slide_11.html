<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: #FFFFFF; 
            font-family: 'Inter', sans-serif;
            color: #334155;
            display: flex;
            flex-direction: column;
            border: 2px solid #0F172A;
        }
        
        .header {
            min-height: 140px;
            border-bottom: 2px solid #0F172A;
            display: flex;
            align-items: center;
            padding: 0 60px;
            background-color: #f8fafc;
        }

        h1 {
            font-family: 'Fira Code', monospace;
            font-weight: 600;
            font-size: 48px;
            color: #0F172A;
        }

        h1::before {
            content: "[ 11 ] ";
            color: #2563EB;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            border-bottom: 2px solid #0F172A;
            flex-grow: 1;
        }

        .grid-cell {
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cell-top-left {
            border-right: 2px solid #0F172A;
            border-bottom: 2px solid #0F172A;
        }

        .cell-top-right {
            border-bottom: 2px solid #0F172A;
        }

        .cell-bottom-left {
            border-right: 2px solid #0F172A;
        }

        h2 {
            font-family: 'Fira Code', monospace;
            font-size: 28px;
            color: #2563EB;
            margin-bottom: 16px;
            font-weight: 600;
        }

        p {
            font-size: 24px;
            line-height: 1.6;
            color: #0F172A;
        }

        .bottom-note {
            padding: 30px 60px;
            font-size: 24px;
            line-height: 1.6;
            color: #0F172A;
            background-color: #eff6ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 140px;
        }

        .bottom-note strong {
            color: #2563EB;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h1>从试教开始，让课程持续生长</h1>
        </div>
        
        <div class="content-area">
            <div class="grid-2x2">
                <div class="grid-cell cell-top-left">
                    <h2>{ 学生是否完成 }</h2>
                    <p>能否独立交付程序、知识图和反思三类成果？</p>
                </div>
                
                <div class="grid-cell cell-top-right">
                    <h2>{ 教师是否可教 }</h2>
                    <p>是否无需开发者支持即可用资源完成 5 学时单元？</p>
                </div>
                
                <div class="grid-cell cell-bottom-left">
                    <h2>{ 资源是否稳定 }</h2>
                    <p>能否在普通离线 Windows 机房稳定运行？</p>
                </div>
                
                <div class="grid-cell cell-bottom-right">
                    <h2>{ 证据是否可信 }</h2>
                    <p>典型错误、完成率、调试记录和学生反馈能否指导下一版修订？</p>
                </div>
            </div>
            
            <div class="bottom-note">
                <p>建议以 <strong>U1</strong> 作为首轮试教单元，先用真实课堂证据修订资源，再扩展到 U2—U6。</p>
                <p><strong>“先让每位学生完成一次可信的数据处理闭环，再让课程持续生长。”</strong></p>
            </div>
        </div>
    </div>
</body>
</html>
