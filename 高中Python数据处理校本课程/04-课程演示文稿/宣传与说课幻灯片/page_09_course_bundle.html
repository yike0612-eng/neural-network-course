<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>完整配套，即刻开课</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    .slide-container { width: 1280px; min-height: 720px; background: #f6f9fc; color: #102b4c; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; display: flex; flex-direction: column; }
    .head { min-height: 148px; padding-top: 43px; padding-left: 78px; padding-right: 78px; display: flex; justify-content: space-between; }
    .kicker { color: #168f87; font-size: 16px; font-weight: 800; letter-spacing: 2px; }
    h1 { margin-top: 14px; font-size: 39px; font-weight: 800; letter-spacing: -1px; }
    .page { color: #8395a8; font-size: 14px; }
    
    .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; padding-left: 78px; padding-right: 78px; padding-top: 30px; }
    
    .card { border-top: 4px solid #102b4c; padding-top: 32px; display: flex; flex-direction: column; }
    .card:nth-child(1) { border-color: #58708b; }
    .card:nth-child(2) { border-color: #168f87; }
    .card:nth-child(3) { border-color: #d89d20; }
    
    .icon-wrap { width: 64px; height: 64px; background: #ebf7f5; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 24px; }
    .card:nth-child(1) .icon-wrap { background: #eef2f6; color: #58708b; }
    .card:nth-child(2) .icon-wrap { background: #ebf7f5; color: #168f87; }
    .card:nth-child(3) .icon-wrap { background: #fcf6e9; color: #d89d20; }
    
    .card h2 { font-size: 26px; margin-bottom: 24px; color: #102b4c; }
    
    .feature-list { list-style: none; }
    .feature-list li { font-size: 18px; line-height: 1.6; margin-bottom: 18px; padding-left: 24px; position: relative; color: #46617d; }
    .feature-list li::before { content: "\f00c"; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; left: 0; top: 2px; font-size: 14px; }
    .card:nth-child(1) .feature-list li::before { color: #58708b; }
    .card:nth-child(2) .feature-list li::before { color: #168f87; }
    .card:nth-child(3) .feature-list li::before { color: #d89d20; }
  </style>
</head>
<body>
  <div class="slide-container">
    <header class="head">
      <div>
        <div class="kicker">实施保障</div>
        <h1>完整配套，即刻开课</h1>
      </div>
      <div class="page">09 / 10</div>
    </header>
    
    <main class="main">
      <section class="card">
        <div class="icon-wrap"><i class="fas fa-box-open"></i></div>
        <h2>资源全覆盖</h2>
        <ul class="feature-list">
          <li>教师实施指导书与逐字稿</li>
          <li>学生学习单与结项任务书</li>
          <li>随堂检测问卷与分析脚本</li>
          <li>自动评分与项目验收工具</li>
        </ul>
      </section>
      
      <section class="card">
        <div class="icon-wrap"><i class="fas fa-laptop-code"></i></div>
        <h2>环境低门槛</h2>
        <ul class="feature-list">
          <li>适配普通 Windows 机房</li>
          <li>支持完全离线环境运行</li>
          <li>以 Python 标准库为基础路径</li>
          <li>提供教学模拟与脱敏数据集</li>
        </ul>
      </section>
      
      <section class="card">
        <div class="icon-wrap"><i class="fas fa-chalkboard-teacher"></i></div>
        <h2>教师强支持</h2>
        <ul class="feature-list">
          <li>分钟级课堂时间分配表</li>
          <li>典型误区与即时调整建议</li>
          <li>代码绘图与预制图双路径备课</li>
          <li>基于证据的试教复盘策略</li>
        </ul>
      </section>
    </main>
  </div>
</body>
</html>
